[project]
name = "outlook-to-pdf"
version = "0.1.2"
description = "Convert Outlook .msg files to self-contained PDFs with embedded attachments."
authors = [
    { name = "Chris Hall", email = "chris.c.hall@gmail.com" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "click>=8.3.3",
    "extract-msg>=0.55.0",
    "weasyprint>=68.1",
]

[project.scripts]
outlook-to-pdf = "outlook_to_pdf:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6.11.0",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
]
